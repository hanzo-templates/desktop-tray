[package]
name = "desktop-tray"
version = "0.1.0"
edition = "2021"
description = "Menubar/tray utility — resident clipboard history, global shortcut, close-hides-not-quits."
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"

# desktop-only plugins — not built for the mobile targets
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
