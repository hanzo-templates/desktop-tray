# Desktop release: one tag -> installers for macOS (Intel + Apple Silicon),
# Windows and Linux. Desktop bundles must be produced ON the target OS (code
# signing, .dmg/.msi/.deb tooling), so this is the one job in the template that
# uses hosted runners per platform instead of the shared Hanzo build fleet.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   args: "--target aarch64-apple-darwin" }
          - { os: macos-latest,   args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-22.04,   args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "./src-tauri -> target" }
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev libayatana-appindicator3-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}
